name: "Daily Docker Health & Security"

# Scheduled workflow to monitor image health and security vulnerabilities.
# Uses Trivy for scanning and runs daily at 2 AM.

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch: # Allows manual triggering

jobs:
  image-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Build Images for Scanning
        run: |
          docker build -t weather-airflow:latest -f Dockerfile.airflow .
          docker build -t weather-dashboard:latest -f dashboard/Dockerfile ./dashboard

      - name: Run Trivy vulnerability scanner (Airflow)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'weather-airflow:latest'
          format: 'table'
          exit-code: '1' # Fail the build on high/critical vulns
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'

      - name: Run Trivy vulnerability scanner (Dashboard)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'weather-dashboard:latest'
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'
